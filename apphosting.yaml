# Settings for Backend (on Cloud Run).
# See https://firebase.google.com/docs/app-hosting/configure#cloud-run
runConfig:
  minInstances: 0
  # maxInstances: 100
  # concurrency: 80
  # cpu: 1
  # memoryMiB: 512

# Environment variables and secrets.
env:
  # Public environment variables (available at build & runtime)
  - variable: NEXT_PUBLIC_GOOGLE_SHEET_ID
    value: "1qKm3c24mTWiol88rHdiQnUY5tzNuNgygzFg2TCSMcWw"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_APPS_SCRIPT_URL
    value: "https://script.google.com/macros/s/AKfycbwjnPkVWaBFzbnerMNPG4y50UN2aa3gy-Tkx9_BRYsyuEjFzhYoESzHFEBKXMl5gs-8/exec"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_SITE_URL
    value: "https://mgcreations.store"
    availability:
      - BUILD
      - RUNTIME

  # Secrets stored in Cloud Secret Manager
  # Run: npx firebase-tools@latest apphosting:secrets:set STRIPE_SECRET_KEY
  # Run: npx firebase-tools@latest apphosting:secrets:set STRIPE_WEBHOOK_SECRET
  - variable: STRIPE_SECRET_KEY
    secret: STRIPE_SECRET_KEY

  - variable: STRIPE_WEBHOOK_SECRET
    secret: STRIPE_WEBHOOK_SECRET
